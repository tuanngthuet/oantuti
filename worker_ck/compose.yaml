# Each image carries one engine; credentials stay outside the image.
x-sandbox: &sandbox
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    - apparmor:unconfined
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: 1g
  memswap_limit: 1g
  pids_limit: 128
  cpus: 2
  restart: unless-stopped
  stop_grace_period: 20s
  extra_hosts:
    - host.docker.internal:host-gateway
services:
  round_16:
    <<: *sandbox
    image: oantuti-ck-round_16:${CK_RELEASE:-local}
    build:
      context: ..
      dockerfile: worker_ck/round_16/Dockerfile
    env_file: .env.round_16
  quarterfinal:
    <<: *sandbox
    image: oantuti-ck-quarterfinal:${CK_RELEASE:-local}
    build:
      context: ..
      dockerfile: worker_ck/quarterfinal/Dockerfile
    env_file: .env.quarterfinal
  semifinal:
    <<: *sandbox
    image: oantuti-ck-semifinal:${CK_RELEASE:-local}
    build:
      context: ..
      dockerfile: worker_ck/semifinal/Dockerfile
    env_file: .env.semifinal
  final:
    <<: *sandbox
    image: oantuti-ck-final:${CK_RELEASE:-local}
    build:
      context: ..
      dockerfile: worker_ck/final/Dockerfile
    env_file: .env.final
  third_place:
    <<: *sandbox
    image: oantuti-ck-third_place:${CK_RELEASE:-local}
    build:
      context: ..
      dockerfile: worker_ck/third_place/Dockerfile
    env_file: .env.third_place
